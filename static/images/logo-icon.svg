<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>

        <!-- Inner Glow Gradient -->
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <!-- Bracket Gradient -->
        <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e0f2fe"/>
        </linearGradient>

        <!-- Plus Gradient -->
        <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>

        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Rounded Squircle -->
    <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" filter="url(#shadow)"/>
    <rect x="9" y="9" width="110" height="110" rx="29" fill="none" stroke="url(#glowGrad)" stroke-width="2"/>

    <!-- Left Bracket < -->
    <path d="M 46 42 L 28 64 L 46 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash / Terminal cursor -->
    <path d="M 66 38 L 56 90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Bracket > -->
    <path d="M 76 42 L 94 64 L 76 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- C++ Sparkles / Plus signs -->
    <!-- Plus 1 -->
    <g transform="translate(100, 26)" filter="url(#glow)">
        <circle cx="0" cy="0" r="10" fill="#10b981"/>
        <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
</svg>
