<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
    <defs>
        <linearGradient id="fbgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="50%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="ftextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <filter id="fshadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Icon Symbol -->
    <g transform="translate(6, 9) scale(0.56)">
        <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#fbgGrad)" filter="url(#fshadow)"/>
        <rect x="9" y="9" width="110" height="110" rx="29" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
        <path d="M 46 42 L 28 64 L 46 86" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 66 38 L 56 90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round"/>
        <path d="M 76 42 L 94 64 L 76 86" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="102" cy="24" r="10" fill="#10b981"/>
        <path d="M 97 24 L 107 24 M 102 19 L 102 29" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Text Typography -->
    <g transform="translate(92, 48)">
        <!-- "Code" -->
        <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-1">Code<tspan fill="url(#ftextGrad)">Beginner</tspan></text>
        <!-- Tagline -->
        <text x="2" y="20" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2.5">C++ PROGRAMMING PLATFORM</text>
    </g>
