{% extends "base.html" %}
{% block title %}Quên mật khẩu - CodeBeginner{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i data-lucide="life-buoy" class="w-7 h-7"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Quên mật khẩu</h2>
            <p class="text-sm text-slate-500 mt-1">Nhập địa chỉ email đăng ký tài khoản để nhận liên kết khôi phục mật khẩu (hiệu lực 30 phút).</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email tài khoản</label>
                <div class="relative">
                    <input type="email" name="email" required placeholder="nhap_email@example.com"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-4 h-4"></i> Gửi liên kết khôi phục
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <a href="{{ url_for('login') }}" class="text-brand-600 hover:underline font-semibold flex items-center justify-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Quay lại trang Đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
