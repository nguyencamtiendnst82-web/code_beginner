{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu - CodeBeginner{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Đặt lại mật khẩu</h2>
            <p class="text-sm text-slate-500 mt-1">Xin chào <strong>{{ user.full_name }}</strong>. Vui lòng nhập mật khẩu mới bảo mật.</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Mật khẩu mới</label>
                <div class="relative">
                    <input type="password" name="new_password" required minlength="8" placeholder="Tối thiểu 8 ký tự gồm chữ & số"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Xác nhận mật khẩu mới</label>
                <div class="relative">
                    <input type="password" name="confirm_password" required minlength="8" placeholder="Nhập lại mật khẩu mới"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    <i data-lucide="shield-check" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-brand-500/20 transition-all flex items-center justify-center gap-2">
                <i data-lucide="check" class="w-4 h-4"></i> Lưu mật khẩu mới
            </button>
        </form>
    </div>
</div>
{% endblock %}
