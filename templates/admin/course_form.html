{% extends "base.html" %}

{% block title %}Thêm khóa học mới - Admin - CodeBeginner{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="mb-6">
        <a href="{{ url_for('admin_courses') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-2">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Quay lại danh sách khóa học
        </a>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Tạo Khóa học Mới</h1>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <form method="POST" action="{{ url_for('admin_create_course') }}" class="space-y-6">
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tên khóa học <span class="text-rose-500">*</span></label>
                <input type="text" name="title" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500" placeholder="Ví dụ: C++ Lập trình Hướng đối tượng (OOP)">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Ngôn ngữ</label>
                    <input type="text" name="language" value="C++" required
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Cấp độ</label>
                    <select name="level" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 bg-white">
                        <option value="Cơ bản">Cơ bản</option>
                        <option value="Nền tảng">Nền tảng</option>
                        <option value="Trung cấp">Trung cấp</option>
                        <option value="Nâng cao">Nâng cao</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Giảng viên / Chuyên gia</label>
                    <select name="expert_id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 bg-white">
                        <option value="">-- Chưa phân công --</option>
                        {% for exp in experts %}
                        <option value="{{ exp.id }}">{{ exp.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Ảnh bìa khóa học (URL)</label>
                <input type="url" name="image_url"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
                       placeholder="https://images.unsplash.com/...">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mô tả tổng quan khóa học <span class="text-rose-500">*</span></label>
                <textarea name="description" rows="5" required
                          class="w-full p-4 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
                          placeholder="Mô tả mục tiêu, kiến thức người học sẽ tiếp thu được..."></textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <a href="{{ url_for('admin_courses') }}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Hủy</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-sm">
                    Tạo khóa học
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
