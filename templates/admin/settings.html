{% extends "base.html" %}

{% block title %}Cài đặt Hệ thống - Admin - CodeBeginner{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <div class="mb-6">
        <a href="{{ url_for('admin_dashboard') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-2">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Quay lại Dashboard Quản trị
        </a>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Cấu hình & Cài đặt Hệ thống</h1>
        <p class="text-xs text-slate-500 mt-1">Quản lý tên nền tảng, giới hạn tài nguyên máy chấm và môi trường biên dịch.</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <form method="POST" action="{{ url_for('admin_settings') }}" class="space-y-6">
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tên nền tảng (Website Name)</label>
                <input type="text" name="site_name" value="{{ settings.get('site_name', 'CodeBeginner') }}" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mô tả ngắn nền tảng</label>
                <textarea name="site_description" rows="3"
                          class="w-full p-4 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">{{ settings.get('site_description', '') }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Giới hạn thời gian chạy mặc định (giây)</label>
                    <input type="number" step="0.5" name="default_time_limit" value="{{ settings.get('default_time_limit', '2.0') }}" required
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Giới hạn bộ nhớ tối đa (MB)</label>
                    <input type="number" name="default_memory_limit" value="{{ settings.get('default_memory_limit', '128') }}" required
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Danh sách Trình biên dịch hỗ trợ</label>
                <input type="text" name="supported_languages" value="{{ settings.get('supported_languages', 'C++ (g++ 10.3 / C++17)') }}" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 font-mono text-xs">
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-end">
                <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-sm transition-all">
                    Lưu cấu hình hệ thống
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
