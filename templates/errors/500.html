{% extends "base.html" %}

{% block title %}500 - Lỗi máy chủ - CodeBeginner{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 p-8 shadow-xl text-center space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto font-bold">
            <i data-lucide="server-crash" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-900">500 Server Error</h1>
        <h2 class="text-sm font-bold text-slate-700">Đã xảy ra lỗi nội bộ máy chủ</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
            Hệ thống đang gặp sự cố xử lý. Vui lòng thử lại sau vài giây hoặc liên hệ ban quản trị.
        </p>
        <div class="pt-2">
            <a href="{{ url_for('index') }}" class="px-5 py-2.5 rounded-xl font-bold text-xs text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition-all inline-block">
                Quay lại Trang chủ
            </a>
        </div>
    </div>
</div>
{% endblock %}
