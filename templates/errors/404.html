{% extends "base.html" %}

{% block title %}404 - Không tìm thấy trang - CodeBeginner{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200 p-8 shadow-xl text-center space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto font-bold">
            <i data-lucide="file-question" class="w-8 h-8"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-900">404 Not Found</h1>
        <h2 class="text-sm font-bold text-slate-700">Trang bạn yêu cầu không tồn tại</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
            Đường dẫn có thể đã bị thay đổi hoặc bài học/bài tập này đã được di chuyển.
        </p>
        <div class="pt-2">
            <a href="{{ url_for('index') }}" class="px-5 py-2.5 rounded-xl font-bold text-xs text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition-all inline-block">
                Quay lại Trang chủ
            </a>
        </div>
    </div>
</div>
{% endblock %}
